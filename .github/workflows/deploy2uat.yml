name: UAT Deploy

on:
  push:
    branches:
      - "uat"
    paths:
      - "apps/frontend/**"
      - ".github/workflows/deploy2uat.yml"
      - ".github/workflows/_deploy.yml"

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      asset_base_url: "/public"
    secrets:
      DEPLOY_ACCESS: ${{ secrets.DEPLOY_ACCESS }}
      SSH_PRIVATE_KEY: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
      REMOTE_HOST: ${{ secrets.UAT_REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.UAT_REMOTE_USER }}
      REMOTE_TARGET: ${{ secrets.PROD_REMOTE_TARGET_SUCHSEITE }}
