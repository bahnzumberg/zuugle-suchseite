name: Deploy

on:
  workflow_call:
    inputs:
      with_backup:
        description: "Create a server-side backup before deploying"
        type: boolean
        default: false
      asset_base_url:
        description: >-
          Base URL of the backend public/ folder, baked into the build.
          PROD points at the CDN pull zone, UAT/DEV serve their own /public.
        type: string
        default: "/public"
      embed_api_url:
        description: >-
          Absolute API URL baked into the embed widget (e.g. https://www.zuugle.at/api).
          Leave empty to skip building and deploying the embed.
        type: string
        default: ""
      embed_asset_base_url:
        description: "Base URL for fonts/images loaded by the embed widget"
        type: string
        default: ""
    secrets:
      DEPLOY_ACCESS:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      REMOTE_HOST:
        required: true
      REMOTE_USER:
        required: true
      REMOTE_TARGET:
        required: true
      REMOTE_PORT:
        required: false
      REMOTE_TARGET_EMBED:
        description: "Directory served under /embed/ (required if embed_api_url is set)"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_ASSET_BASE_URL: ${{ inputs.asset_base_url }}
        run: npm run build

      - name: Build embed widget
        if: inputs.embed_api_url != ''
        env:
          VITE_API_URL: ${{ inputs.embed_api_url }}
          VITE_ASSET_BASE_URL: ${{ inputs.embed_asset_base_url }}
        run: npm run embed:build

      - name: Unlock network access to server
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" "${{ secrets.DEPLOY_ACCESS }}"
          echo "Waiting 59 seconds for access rule to activate..."
          sleep 59

      - name: Back up current deployment
        if: inputs.with_backup
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            rm -f /root/suchseite/backup/app.tar.gz
            tar -zcvf /root/suchseite/backup/app.tar.gz /root/suchseite/app/

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete --exclude='*.md'"
          SOURCE: "apps/frontend/build/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}

      - name: Deploy embed widget to server
        if: inputs.embed_api_url != ''
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "apps/frontend/build-embed/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET_EMBED }}
