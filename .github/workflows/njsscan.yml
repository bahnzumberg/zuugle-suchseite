# nodejsscan static security scanner — scoped to the Node.js backend.
name: njsscan sarif

on:
    push:
        branches: ["uat"]
        paths:
            - "apps/backend/**"
    pull_request:
        branches: ["uat"]
        paths:
            - "apps/backend/**"
    schedule:
        - cron: "15 13 * * 3"

permissions:
    contents: read

jobs:
    njsscan:
        permissions:
            contents: read
            security-events: write
            actions: read
        runs-on: ubuntu-latest
        name: njsscan code scanning
        steps:
            - name: Checkout the code
              uses: actions/checkout@v7
            - name: nodejsscan scan
              id: njsscan
              uses: ajinabraham/njsscan-action@231750a435d85095d33be7d192d52ec650625146
              with:
                  args: "apps/backend --sarif --output results.sarif || true"
            - name: Upload njsscan report
              uses: github/codeql-action/upload-sarif@v4.37.9
              with:
                  sarif_file: results.sarif
