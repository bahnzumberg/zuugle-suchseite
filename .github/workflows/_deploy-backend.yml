# Reusable deploy workflow for apps/backend — shared by PROD / UAT / DEV.
name: Deploy Backend (reusable)

on:
    workflow_call:
        inputs:
            environment:
                description: "Environment label used in test/issue titles (PROD/UAT/DEV)"
                required: true
                type: string
            api_base_url:
                description: "Base URL the post-deploy API tests run against"
                required: true
                type: string
            do_backup:
                description: "Back up the remote app dir before deploying (PROD)"
                required: false
                type: boolean
                default: false
            backup_archive_path:
                description: "Where the backup tarball is written on the remote host"
                required: false
                type: string
                default: "/root/suchseite/backup/api.tar.gz"
            setup_docker:
                description: "Start the docker compose DB stack on the remote host (UAT/DEV)"
                required: false
                type: boolean
                default: false
            run_migrations:
                description: "Run knex migrations (npm run migrate) after deploy (UAT/DEV)"
                required: false
                type: boolean
                default: false
            use_basic_auth:
                description: "Pass basic-auth credentials to the API tests (UAT/DEV)"
                required: false
                type: boolean
                default: false
            node_env:
                description: "NODE_ENV exported on the remote host during restart (empty = leave unset)"
                required: false
                type: string
                default: ""
            command_timeout:
                description: "Timeout for the remote restart ssh command"
                required: false
                type: string
                default: "10m"
            pm2_app_name:
                description: "PM2 app to restart. Scope per environment so UAT/DEV deploy does not restart the other env's apps."
                required: false
                type: string
                default: "all"
        secrets:
            SSH_PRIVATE_KEY:
                required: true
            REMOTE_HOST:
                required: true
            REMOTE_USER:
                required: true
            REMOTE_PORT:
                required: true
            REMOTE_TARGET:
                required: true
            DEPLOY_ACCESS:
                required: true
            BASIC_AUTH_USER:
                required: false
            BASIC_AUTH_PASSWORD:
                required: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: apps/backend
        steps:
            - uses: actions/checkout@v7
            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24.18.0"

            - name: Cache node_modules
              id: cache-npm
              uses: actions/cache@v6
              env:
                  cache-name: cache-node-modules
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('apps/backend/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Install npm dependencies
              run: npm install
            - name: Run build task
              run: npm run build
            - name: Unlock network access to server
              run: |
                  curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" "${{ secrets.DEPLOY_ACCESS }}"
                  echo "Waiting 59 seconds for access rule to activate..."
                  sleep 59
            - name: Back up app on remote host
              if: inputs.do_backup
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.REMOTE_HOST }}
                  username: ${{ secrets.REMOTE_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.REMOTE_PORT }}
                  script: |
                      rm ${{ inputs.backup_archive_path }}
                      tar -zcvf ${{ inputs.backup_archive_path }} --exclude=${{ secrets.REMOTE_TARGET }}public/gpx-image --exclude=${{ secrets.REMOTE_TARGET }}public/gpx --exclude=${{ secrets.REMOTE_TARGET }}public/gpx-track ${{ secrets.REMOTE_TARGET }}
            - name: Deploy to Server
              uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  ARGS: "-rlgoDzvc -i --delete"
                  SOURCE: "apps/backend/build/"
                  REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
                  REMOTE_USER: ${{ secrets.REMOTE_USER }}
                  TARGET: ${{ secrets.REMOTE_TARGET }}
                  # Generated on the server, absent from the build: without an
                  # exclude, --delete would wipe them on every deploy. 
                  EXCLUDE: "/dist/, /node_modules/, /public/gpx/, /public/gpx-image/, /public/gpx-image-with-track/, /public/gpx-track/, /public/sitemap_*.xml, /public/robots.txt, *.md, .env"
            - name: Restart the API on remote host
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.REMOTE_HOST }}
                  username: ${{ secrets.REMOTE_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.REMOTE_PORT }}
                  command_timeout: ${{ inputs.command_timeout }}
                  script: |
                      export PATH=$PATH:/root/.nvm/versions/node/v24.18.0/bin
                      ${{ inputs.node_env != '' && format('export NODE_ENV={0}', inputs.node_env) || '' }}
                      cd ${{ secrets.REMOTE_TARGET }}
                      npm install --omit=dev
                      ${{ inputs.setup_docker && 'docker compose up -d' || '' }}
                      ${{ inputs.run_migrations && 'npm run migrate' || '' }}
                      pm2 restart ${{ inputs.pm2_app_name }}

    test-api:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: apps/backend
        permissions:
            issues: write
            contents: read
        steps:
            - uses: actions/checkout@v7
            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24.18.0"
            - name: Install npm dependencies
              run: npm install
            - name: Run API Tests
              env:
                  API_BASE_URL: ${{ inputs.api_base_url }}
                  API_USER: ${{ inputs.use_basic_auth && secrets.BASIC_AUTH_USER || '' }}
                  API_PASSWORD: ${{ inputs.use_basic_auth && secrets.BASIC_AUTH_PASSWORD || '' }}
              run: npm test
            - name: Close Issue on Success
              if: success()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh issue list \
                    --repo ${{ github.repository }} \
                    --state open \
                    --label "bug" \
                    --search "BUG: ${{ inputs.environment }} API Tests Failed" \
                    --json number \
                    --jq '.[].number' \
                    | xargs -r -I {} gh issue close {} --comment "✅ ${{ inputs.environment }} API Tests passed in workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            - name: Create Issue on Failure
              if: failure()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh issue create \
                    --title "BUG: ${{ inputs.environment }} API Tests Failed" \
                    --body "The automated API tests failed on ${{ inputs.environment }} environment.\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}\nActor: @${{ github.actor }}" \
                    --assignee "${{ github.actor }}" \
                    --label "bug"
