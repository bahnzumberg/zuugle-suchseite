# /etc/nginx/snippets/zuugle-map.conf
# Include this file in the http {} block of nginx.conf:
#   include snippets/zuugle-map.conf;
#
# Maps each Zuugle TLD to its language-specific index.html for SPA fallback.

map $host $zuugle_index {
    ~*zuugle\.de$   /index-de.html;
    ~*zuugle\.it$   /index-it.html;
    ~*zuugle\.ch$   /index-ch.html;
    ~*zuugle\.fr$   /index-fr.html;
    ~*zuugle\.li$   /index-li.html;
    ~*zuugle\.si$   /index-si.html;
    default         /index.html;
}

# Detect social media scrapers, search engines, and AI bots for rich OpenGraph preview
map $http_user_agent $is_crawler {
    default 0;
    ~*facebookexternalhit 1;
    ~*Facebot             1;
    ~*Twitterbot          1;
    ~*LinkedInBot         1;
    ~*WhatsApp            1;
    ~*TelegramBot         1;
    ~*Discordbot          1;
    ~*Applebot            1;
    ~*Slackbot            1;
    ~*SkypeUriPreview     1;
    ~*Googlebot           1;
    ~*bingbot             1;
    ~*DuckDuckBot         1;
    ~*Pinterest           1;
    ~*GPTBot              1;
    ~*ClaudeBot           1;
    ~*PerplexityBot       1;
}

