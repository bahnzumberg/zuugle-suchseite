# /etc/nginx/snippets/zuugle.conf (PROD)
# Updated: 2026-07-07 — Security hardening (Issues #909–#919)

charset utf-8;
server_tokens off;                                          # #917

root /root/suchseite/app;
index index.html;

# ──────────────────────────────────────────────────────────
# Security Headers
# ──────────────────────────────────────────────────────────

# #909 — HSTS
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# #911 — CSP (Report-Only first — rename to Content-Security-Policy once verified)
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' https://stats.bahnzumberg.at; style-src 'self' 'unsafe-inline'; font-src 'self' https://cdn.zuugle.at; img-src 'self' https://cdn.zuugle.at https://cdn.bahn-zum-berg.at https://*.tile.openstreetmap.org https://opentopo.bahnzumberg.at data: blob:; connect-src 'self' https://stats.bahnzumberg.at https://*.tile.openstreetmap.org https://opentopo.bahnzumberg.at; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';"
    always;

# #913 — Clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# #914 — MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# #915 — Referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# #916 — Browser features (geolocation allowed for map radius search)
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

# #918 — Cross-Origin Isolation
add_header Cross-Origin-Opener-Policy "same-origin" always;

# ──────────────────────────────────────────────────────────
# Compression
# ──────────────────────────────────────────────────────────

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml;

# ──────────────────────────────────────────────────────────
# Static assets
# ──────────────────────────────────────────────────────────

location /app_static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /i18n/ {
    expires 1h;
}

# ──────────────────────────────────────────────────────────
# API proxy
# ──────────────────────────────────────────────────────────

location /api/ {
    proxy_pass http://localhost:6060;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ──────────────────────────────────────────────────────────
# Public assets (API-side)
# ──────────────────────────────────────────────────────────

location /public/ {
    alias /root/suchseite/api/public/;
}

# ──────────────────────────────────────────────────────────
# #919 — security.txt (RFC 9116)
# ──────────────────────────────────────────────────────────

location = /.well-known/security.txt {
    alias /root/suchseite/app/.well-known/security.txt;
    default_type text/plain;
}

# ──────────────────────────────────────────────────────────
# SVG365 availability graphics
# ──────────────────────────────────────────────────────────
# Serve pre-generated files directly; a missing SVG must return a real 404
# so the frontend guard hides the reachability section. Without this the
# SPA fallback below would serve index.html with a 200 for missing files.

location /svg365/ {
    try_files $uri =404;
}

# ──────────────────────────────────────────────────────────
# Generated per-country sitemaps (backend public/)
# ──────────────────────────────────────────────────────────

location ~ ^/(sitemap_[a-z]{2}\.xml)$ {
    alias /root/suchseite/api/public/$1;
    default_type application/xml;
}

# ──────────────────────────────────────────────────────────
# SPA fallback
# ──────────────────────────────────────────────────────────

location / {
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri/ $zuugle_index;
}
