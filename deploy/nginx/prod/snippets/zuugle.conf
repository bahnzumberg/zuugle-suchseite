# /etc/nginx/snippets/zuugle.conf (PROD)
# Updated: 2026-07-07 — Security hardening (Issues #909–#919)

charset utf-8;
server_tokens off;                                          # #917

root /root/suchseite/app;
index index.html;

# ──────────────────────────────────────────────────────────
# Security Headers
# ──────────────────────────────────────────────────────────

# #909 — HSTS
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# #911 — CSP (Report-Only first — rename to Content-Security-Policy once verified)
# The GPX tracks are the one asset the app fetches instead of linking (drawing them on the map and
# the download button both go through `fetch()`).
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' https://stats.bahnzumberg.at; style-src 'self' 'unsafe-inline'; font-src 'self' https://cdn.zuugle.at; img-src 'self' https://cdn.zuugle.at https://cdn.bahn-zum-berg.at https://*.tile.openstreetmap.org https://opentopo.bahnzumberg.at data: blob:; connect-src 'self' https://cdn.zuugle.at https://stats.bahnzumberg.at https://*.tile.openstreetmap.org https://opentopo.bahnzumberg.at; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://www.verbundlinie.at https://www.360world.at https://www.bahn-zum-berg.at; form-action 'self';"
    always;

# #913 — Clickjacking
# X-Frame-Options removed: it only supports DENY / SAMEORIGIN and cannot
# allowlist specific origins.  Clickjacking protection is handled by the
# CSP frame-ancestors directive above, which permits verbundlinie.at.

# #914 — MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# #915 — Referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# #916 — Browser features (geolocation allowed for map radius search)
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

# #918 — Cross-Origin Isolation
add_header Cross-Origin-Opener-Policy "same-origin" always;

# ──────────────────────────────────────────────────────────
# Compression
# ──────────────────────────────────────────────────────────

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml;

# ──────────────────────────────────────────────────────────
# Static assets
# ──────────────────────────────────────────────────────────

location /app_static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /i18n/ {
    expires 1h;
}

# ──────────────────────────────────────────────────────────
# API proxy
# ──────────────────────────────────────────────────────────

location /api/ {
    proxy_pass http://localhost:6060;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ──────────────────────────────────────────────────────────
# Weather overlays (regenerated daily — short CDN TTL)
# ──────────────────────────────────────────────────────────
# Must be matched before the general /public/ block.
# weather_metadata.json: always revalidate so the frontend sees new days immediately.
# weather_overlay_*.webp: cache up to 6 h — they carry the date in the filename
# and don't change intra-day, but must not survive until the next morning.

location = /public/weather/weather_metadata.json {
    alias /root/suchseite/api/public/weather/weather_metadata.json;
    add_header Cache-Control "public, no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /public/weather/ {
    alias /root/suchseite/api/public/weather/;
    add_header Cache-Control "public, max-age=21600" always;  # 6 hours
    add_header Access-Control-Allow-Origin "*" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ──────────────────────────────────────────────────────────
# Public assets (API-side)
# ──────────────────────────────────────────────────────────

# Embed widget for third-party pages (deployed by deploy2prod.yml, separate from
# the app root so the app's rsync --delete doesn't remove it).
location /embed/ {
    alias /root/suchseite/embed/;
    expires 1h;
    add_header Cache-Control "public";
    add_header Access-Control-Allow-Origin "https://www.bahn-zum-berg.at" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /public/ {
    alias /root/suchseite/api/public/;

    # BunnyCDN adds `Access-Control-Allow-Origin` itself for the types it knows
    # (fonts, images), but not for `.gpx`, which it serves as
    # application/octet-stream — so the tracks the app `fetch()`es from
    # cdn.zuugle.at need the header from here, via the pull zone. Everything
    # under /public/ is public generated content, so it applies to the folder.
    add_header Access-Control-Allow-Origin "*" always;

    # An `add_header` in a location replaces every inherited one, so the two
    # security headers that still matter for static files are repeated.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ──────────────────────────────────────────────────────────
# #919 — security.txt (RFC 9116)
# ──────────────────────────────────────────────────────────

location = /.well-known/security.txt {
    alias /root/suchseite/app/.well-known/security.txt;
    default_type text/plain;
}


# ──────────────────────────────────────────────────────────
# Generated per-country sitemaps (backend public/)
# ──────────────────────────────────────────────────────────

location ~ ^/(sitemap_[a-z][a-z]\.xml)$ {
    alias /root/suchseite/api/public/$1;
    default_type application/xml;
}

# ──────────────────────────────────────────────────────────
# Crawler / OpenGraph preview for tours
# ──────────────────────────────────────────────────────────

location ~ ^/tour/([0-9]+) {
    if ($is_crawler = 1) {
        proxy_pass http://localhost:6060/api/seo$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        break;
    }
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri/ $zuugle_index;
}

# ──────────────────────────────────────────────────────────
# SPA fallback
# ──────────────────────────────────────────────────────────

location / {
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri/ $zuugle_index;
}

