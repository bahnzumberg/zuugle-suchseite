<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zuugle Embed – Dev Preview</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #f5f5f5;
      }
      .wp-mock-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        box-sizing: border-box;
        height: 60px;
        background: #23282d;
        color: #fff;
        padding: 16px 24px;
        font-size: 18px;
        display: flex;
        align-items: center;
      }
      .wp-mock-footer {
        background: #23282d;
        color: #aaa;
        padding: 16px 24px;
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Simulates a sticky host header on WordPress (height: 60px) -->
    <div class="wp-mock-header">
      🚞 bahn-zum-berg.at — Mock WordPress Sticky Header (60px)
    </div>

    <div
      id="zuugle-embed"
      data-domain="www.zuugle.at"
      data-sticky-top="60"
      data-sync-url="true"
      data-lang="de"
      data-city="amstetten"
      data-map="true"
    ></div>

    <div class="wp-mock-footer">
      © 2026 Bahn zum Berg — Mock WordPress Footer
    </div>

    <script type="module" src="/src/embed.tsx"></script>
  </body>
</html>
